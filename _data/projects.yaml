- title: Audiovisual Feedback
  subtitle: How is audiovisual feedback processed?
  image: images/doorsounds.jpeg
  description: Our goal here is to test the effect of feedback modality on behavioural and neural responses. We are predicting that audiovisual feedback will elicit faster brain and behavioural responses.

- title: Patch Foraging
  subtitle: How does the frontal cortex support foraging decisions?
  image: images/applepicker.jpeg
  description: Frontal cortex is thought to support exploration by forcing us to "try something new". Here we are asking whether this process depends on costs associated with diffent decision types.

- title: Task Learnability
  subtitle: Why is it important for people to feel like they're making progress?
  image: images/differentdoors.jpeg
  description: Which is more fun, roulette or blackjack? In this project we hope to answer this question by comparing brain responses to rewards across learnable and unlearnable gambling tasks.

- title: Visual Imagery
  subtitle: How does visual imagery support perceptual learning?
  image: images/imagery.jpeg
  description: Here we plan to have participants reactivate a visual memory during learning. To highlight a specific role of imagery, we plan to test people with imagery deficits (i.e., those with aphantasia). 

- title: Face Morphing
  subtitle: How does the brain track dynamic faces? 
  image: images/facemorph.jpeg
  description: Real-world faces are dynamic. In this experiment we plan to measure and carefully quantify the brain's response to a continuously changing face (e.g., one that morphs between two emotions).

- title: Narrative Structure
  subtitle: How does narrative affect reward processing?
  image: images/narrative.jpeg
  description: Here, participants played a "Choose Your Own Adveture" style game in which they made decisions and experienced outcomes. We predict reward processing will be enhanced relative to a nonnarrative condition.

- title: Near or Far
  subtitle: Do reward responses depend on reward proximity?
  image: images/nearorfar.jpeg
  description: In the real world, close rewards are better than distant rewards. Here we recorded EEG and rewarded participants while they made distance judgements about near and far items.

- title: Retinopathy
  subtitle: Do medical decisions rely on evidence accumulation?
  image: images/retinopathy.jpeg
  description: When making judgements about artificial stimuli, people accumulate evidence up to a decision threshold. Our goal here is to show that this process also applies for real-world decisions such as medical diagnoses.

- title: Urgent Bandit
  subtitle: How does urgency affect decision-making?
  image: images/urgentbandit.jpeg
  description: Time pressue is thought to impair cognitive control. Here was ask whether it alters decision-making, e.g. by shifting people away from a more deliberate to a more automatic strategy.

- title: Value Flanker
  subtitle: How does error processing interact with reward processing?
  image: images/valueflanker.jpeg
  description: Here we designed a new task to test error processing and feedback processing. We predict that indivisuals who are more focused on their errors will respond less to external feedback (and vice-versa).

