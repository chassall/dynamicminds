# site properties and page defaults
title: Dynamic Minds Laboratory
subtitle: 
description: The Dynamic Minds Lab, led by Dr. Cameron Hassall, explores how minds adapt, learn, and make decisions across a range of real-world contexts. Using tools from psychology, neuroscience, and cognitive science, the lab investigates the dynamic processes that shape human thought, behavior, and experience.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: hassallc@macewan.ca
  orcid: 0000-0001-9283-2813
  google-scholar: -doZi8MAAAAJ
  github: chassall
  twitter: cameronhassall

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
